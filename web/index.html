<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChromaVibe</title>
    <meta
      name="description"
      content="Rekomendasi palet warna web dari satu warna primer, dibentuk oleh tema estetika dan divalidasi kontrasnya."
    />
    <meta name="theme-color" content="#08080e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChromaVibe" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * Peristiwa beforeinstallprompt bisa dipancarkan peramban sebelum React
       * selesai dipasang. Kalau pendengarnya baru dipasang di dalam useEffect,
       * peristiwa itu sudah lewat dan tombol Pasang tidak pernah muncul.
       * Skrip ini berjalan lebih dulu dan menyimpannya supaya bisa diambil
       * kapan pun komponen siap.
       */
      window.__cvPromptPasang = null
      window.addEventListener('beforeinstallprompt', function (peristiwa) {
        peristiwa.preventDefault()
        window.__cvPromptPasang = peristiwa
        window.dispatchEvent(new Event('chromavibe:pasang-tersedia'))
      })
      window.addEventListener('appinstalled', function () {
        window.__cvPromptPasang = null
        window.dispatchEvent(new Event('chromavibe:terpasang'))
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
